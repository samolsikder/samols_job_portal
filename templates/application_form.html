
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form - Samols Carrier</title>
    {% include 'bootstrap.html' %}
</head>

<body>
    {% include 'nav.html' %}
    <div  class="container my-5">
         <h1 class="text-center mb-4">
            <b>Samols Carrier</b>
        </h1>
    </div>
     {% include 'banner.html' %}

    <div class="container my-5">
       

        <div class="row justify-content-center">
            <div class="col-md-6 border p-4 shadow-sm rounded">
                <h4 class="mb-4 text-secondary">Application Form</h4>
                
                <script src="https://www.google.com/recaptcha/api.js" async defer></script>
                
                <form action="/job/{{job.id}}/apply" method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control" placeholder="Enter your name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">LinkedIn URL</label>
                        <input type="url" name="linkedin_url" class="form-control" placeholder="Enter your LinkedIn ID">
                    </div>

                    <div class="g-recaptcha mb-3" data-sitekey="6LcCUpYsAAAAAEREg9_Zfs30eP26U7hChozOGAKY"></div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary w-100">Submit Application</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    {% include 'FOOTER.HTML' %}
</body>
</html>
