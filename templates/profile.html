<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - {{ profile['full_name'] }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .profile-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-top: 50px;
        }
        .profile-img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border: 5px solid #fff;
        }
    </style>
</head>
<body>

    {% include 'nav.html' %}

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="profile-card shadow-sm text-center">
                    
                    <img src="{{ profile['image_url'] }}" class="rounded-circle profile-img shadow mb-3" alt="Profile Picture">
                    
                    <h2 class="fw-bold">{{ profile['full_name'] }}</h2>
                    <p class="text-primary fw-semibold">{{ profile['designation'] }}</p>
                    
                    <hr class="my-4">

                    <div class="text-start px-md-4">
                        <h4 class="mb-3">About Me</h4>
                        <p class="text-muted" style="line-height: 1.6;">
                            {{ profile['bio'] }}
                        </p>

                        <div class="row mt-4">
                            <div class="col-sm-6 mb-3">
                                <strong>Email:</strong><br>
                                <span class="text-muted">{{ profile['email'] }}</span>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <strong>Location:</strong><br>
                                <span class="text-muted">{{ profile['location'] }}</span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <a href="mailto:{{ profile['email'] }}" class="btn btn-dark px-4">Hire Me</a>
                        <a href="/" class="btn btn-outline-secondary px-4">Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {% include 'footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
