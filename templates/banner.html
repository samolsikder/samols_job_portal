<style>
    #banner {
        width: 100%;
        /* হাইট কিছুটা কমিয়ে ৩০০px করা হয়েছে যা স্ট্যান্ডার্ড */
        height: 300px; 
        object-fit: cover;
        /* ছবির পজিশন মাঝখানে রাখার জন্য */
        object-position: center; 
        margin-bottom: 24px;
        /* চারকোনা একটু গোল করার জন্য চাইলে এটি দিতে পারেন */
        border-radius: 0px;  
        /* হালকা একটু শ্যাডো দিলে সুন্দর লাগবে */
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    /* মোবাইল স্ক্রিনের জন্য হাইট আরও কমিয়ে দেওয়া */
    @media (max-width: 768px) {
        #banner {
            height: 200px;
        }
    }
</style>
<div class="full-width-banner">
    <img class="img-fluid" id="banner" src="{{url_for('static',filename='image/school.jpg')}}" alt="School Building">
</div>
